name: Regression tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install terminal test dependency
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Check distributed skill references
        run: python3 tests/check_skill_package.py
      - name: Run regression and private-socket tmux tests
        env:
          ORCH_RUN_TMUX_TESTS: '1'
        run: python3 -m unittest discover -s tests -v
